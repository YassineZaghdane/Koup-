<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koupe Pro - Agenda</title>
<link rel="stylesheet" href="_styles.css">
<style>
body{margin:0;background:var(--cream);font-family:var(--font-body);display:flex}.pro-side{width:240px;min-height:100vh;background:var(--velvet);padding:18px 10px;display:flex;flex-direction:column}.pro-main{flex:1;padding:24px}
.tabs{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}.tab-btn{border:1px solid var(--border);background:#fff;color:var(--velvet);padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer}.tab-btn.active{background:var(--plum);color:#fff;border-color:var(--plum)}
.agenda-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px}
.agenda-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--border-soft)}.agenda-row:first-child{border-top:none}
.agenda-time{font-family:var(--font-display);font-size:13px;color:var(--sand);padding-top:10px}
.agenda-slot{min-height:38px;padding:10px 14px;border-radius:10px;border:1px dashed var(--border);color:var(--sand-light);font-size:12px;font-style:italic;display:flex;align-items:center}
.agenda-slot.booked{border:none;background:var(--almond-soft);color:var(--plum);font-style:normal}
.agenda-slot.booked-velvet{background:var(--velvet);color:var(--almond);border:none;font-style:normal}
.agenda-slot.booked-plum{background:var(--plum);color:#fff;border:none;font-style:normal}
.agenda-slot.pause{background:var(--cream);color:var(--sand);border:1px solid var(--border-soft)}
.ag-client{font-weight:600;margin-right:8px}.ag-service{opacity:.78;font-size:11px}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.week-day{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px}.week-day h4{font-size:12px;margin:0 0 10px;color:var(--sand)}.week-item{padding:8px;border-radius:8px;margin-bottom:6px;font-size:11px}
.w-booked{background:var(--almond-soft);color:var(--plum)}.w-free{background:#fff;border:1px dashed var(--border);color:var(--sand)}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.month-cell{background:#fff;border:1px solid var(--border);border-radius:10px;min-height:76px;padding:8px}.month-num{font-size:12px;color:var(--sand);margin-bottom:6px}.month-meta{font-size:10px;color:var(--plum)}
.hidden{display:none !important}
@media(max-width:900px){.pro-side{display:none}.pro-main{padding:14px}.month-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<aside class="pro-side" id="pro-side"></aside>
<main class="pro-main">
  <div class="pro-topbar" id="pro-topbar"></div>
  <div class="pro-breadcrumb" id="pro-breadcrumb"></div>
  <div class="tabs">
    <button class="tab-btn active" data-view="day" onclick="setView('day', this)">Jour</button>
    <button class="tab-btn" data-view="week" onclick="setView('week', this)">Semaine</button>
    <button class="tab-btn" data-view="month" onclick="setView('month', this)">Mois</button>
  </div>

  <section id="view-day" class="agenda-card"></section>
  <section id="view-week" class="agenda-card hidden"></section>
  <section id="view-month" class="agenda-card hidden"></section>
  <div class="toast-container" id="pro-toasts"></div>
</main>
<script src="script/_shared.js"></script>
<script src="script/pro-ui.js"></script>
<script>
initProPage({ active: "agenda", title: "Agenda", breadcrumb: "Agenda", subtitle: "Vues jour, semaine et mois" });

function renderDay() {
  const el = document.getElementById("view-day");
  el.innerHTML = "";
  PRO_DEMO.agenda.forEach((s) => {
    let slotHtml = "";
    if (s.statut === "free") slotHtml = `<div class="agenda-slot">Creneau libre</div>`;
    else if (s.statut === "pause") slotHtml = `<div class="agenda-slot pause">Pause dejeuner</div>`;
    else slotHtml = `<div class="agenda-slot ${s.statut}"><span class="ag-client">${s.client}</span><span class="ag-service">${s.service} · ${s.duree} min</span></div>`;
    el.innerHTML += `<div class="agenda-row"><div class="agenda-time">${s.heure}</div>${slotHtml}</div>`;
  });
}

function renderWeek() {
  const el = document.getElementById("view-week");
  const days = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
  let html = `<div class="week-grid">`;
  days.forEach((d, i) => {
    const slots = PRO_DEMO.agenda.slice((i % 3), (i % 3) + 3);
    html += `<div class="week-day"><h4>${d}</h4>`;
    slots.forEach((s) => {
      if (s.statut === "free") html += `<div class="week-item w-free">${s.heure} · Libre</div>`;
      else if (s.statut !== "pause") html += `<div class="week-item w-booked">${s.heure} · ${s.client}</div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}

function renderMonth() {
  const el = document.getElementById("view-month");
  let html = `<div class="month-grid">`;
  for (let i = 1; i <= 30; i++) {
    const booked = (i * 3) % 8 + 2;
    html += `<div class="month-cell"><div class="month-num">${i}</div><div class="month-meta">${booked} RDV</div></div>`;
  }
  html += `</div>`;
  el.innerHTML = html;
}

function setView(view, btn) {
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("view-day").classList.toggle("hidden", view !== "day");
  document.getElementById("view-week").classList.toggle("hidden", view !== "week");
  document.getElementById("view-month").classList.toggle("hidden", view !== "month");
}

renderDay();
renderWeek();
renderMonth();
</script>
</body>
</html>
