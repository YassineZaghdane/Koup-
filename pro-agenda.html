<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koupe Pro - Agenda</title>
<link rel="stylesheet" href="_styles.css">
<style>
body{margin:0;background:var(--cream);font-family:var(--font-body);display:flex}.pro-side{width:240px;min-height:100vh;background:var(--velvet);padding:18px 10px;display:flex;flex-direction:column}.pro-brand{color:#fff;font-family:var(--font-display);font-size:30px;padding:0 10px 2px}.pro-badge{color:rgba(231,212,187,.45);font-size:11px;letter-spacing:.08em;font-weight:700;padding:0 10px 12px}.pro-link{display:block;color:rgba(255,255,255,.7);text-decoration:none;padding:10px 12px;border-radius:10px;margin:3px 0;font-size:14px}.pro-link.active{background:var(--plum);color:#fff}.pro-side-footer{margin-top:auto;padding-top:10px}.pro-main{flex:1;padding:24px}.pro-topbar{display:flex;justify-content:space-between;gap:12px;align-items:center}.pro-title{margin:0;font-family:var(--font-display);font-weight:500}.pro-subtitle{color:var(--sand);font-size:13px;margin-top:3px}.pro-top-actions{display:flex;gap:8px}.pro-breadcrumb{font-size:12px;color:var(--sand);margin:10px 0 14px}.row{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0}.slot{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px}@media(max-width:900px){.pro-side{display:none}.pro-topbar{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<aside class="pro-side" id="pro-side"></aside>
<main class="pro-main">
  <div class="pro-topbar" id="pro-topbar"></div>
  <div class="pro-breadcrumb" id="pro-breadcrumb"></div>
  <div id="agenda"></div>
  <div class="toast-container" id="pro-toasts"></div>
</main>
<script src="script/_shared.js"></script>
<script src="script/pro-ui.js"></script>
<script>
initProPage({ active: "agenda", title: "Agenda", breadcrumb: "Agenda" });
const el = document.getElementById("agenda");
PRO_DEMO.agenda.forEach((s) => {
  el.innerHTML += `<div class="row"><div style="color:var(--sand);font-family:var(--font-display);padding-top:10px;">${s.heure}</div><div class="slot">${s.statut==="free"?"Creneau libre":s.statut==="pause"?"Pause dejeuner":"<strong>"+s.client+"</strong> - "+s.service+" ("+s.duree+" min)"}</div></div>`;
});
</script>
</body>
</html>
