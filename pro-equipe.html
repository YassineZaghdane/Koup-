<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koupe Pro - Equipe</title>
<link rel="stylesheet" href="_styles.css">
<style>
body{margin:0;background:var(--cream);font-family:var(--font-body);display:flex}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--border-soft);text-align:left;font-size:13px}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media(max-width:1000px){.form-grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.pro-side{display:none}.pro-main{padding:14px}}
</style>
</head>
<body>
<aside class="pro-side" id="pro-side"></aside>
<main class="pro-main">
  <div class="pro-topbar" id="pro-topbar"></div>
  <div class="pro-breadcrumb" id="pro-breadcrumb"></div>
  <div class="card">
    <div class="form-grid">
      <input id="m-nom" class="form-input" placeholder="Nom membre">
      <input id="m-role" class="form-input" placeholder="Role">
      <input id="m-spec" class="form-input" placeholder="Specialite">
      <input id="m-dispo" class="form-input" placeholder="Disponibilite">
    </div>
    <button class="btn btn-primary btn-sm" onclick="addMember()">+ Ajouter membre</button>
    <div class="table-scroll" style="margin-top:12px;">
      <table>
        <thead><tr><th>Membre</th><th>Role</th><th>Specialite</th><th>Disponibilite</th><th>Actions</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
  <div class="toast-container" id="pro-toasts"></div>
</main>
<script src="script/_shared.js"></script>
<script src="script/pro-ui.js"></script>
<script>
initProPage({ active: "equipe", title: "Equipe", breadcrumb: "Equipe", subtitle: "Gestion des membres du salon" });

const TEAM_KEY = "koupe_pro_team";
const fallbackTeam = [
  { id: 1, nom: "Zakaria Bensalem", role: "Gerant", spec: "Coupe + Barbe", dispo: "Mar-Sam" },
  { id: 2, nom: "Ahmed L.", role: "Barbier Senior", spec: "Rasage traditionnel", dispo: "Lun-Ven" },
  { id: 3, nom: "Karim F.", role: "Barbier", spec: "Skin fade", dispo: "Mer-Dim" }
];

let team = JSON.parse(localStorage.getItem(TEAM_KEY) || "null") || fallbackTeam;

function saveTeam() { localStorage.setItem(TEAM_KEY, JSON.stringify(team)); }

function renderTeam() {
  const tb = document.getElementById("tb");
  tb.innerHTML = team.map(m => `<tr>
    <td>${m.nom}</td><td>${m.role}</td><td>${m.spec}</td><td>${m.dispo}</td>
    <td><button class="btn btn-ghost btn-sm" style="color:#c0392b" onclick="removeMember(${m.id})">Supprimer</button></td>
  </tr>`).join("");
}

function addMember() {
  const nom = document.getElementById("m-nom").value.trim();
  const role = document.getElementById("m-role").value.trim();
  const spec = document.getElementById("m-spec").value.trim();
  const dispo = document.getElementById("m-dispo").value.trim();
  if (!nom || !role) return proShowToast("Champs requis", "Nom et role sont obligatoires.");
  team.unshift({ id: Date.now(), nom, role, spec: spec || "-", dispo: dispo || "-" });
  saveTeam();
  renderTeam();
  document.getElementById("m-nom").value = "";
  document.getElementById("m-role").value = "";
  document.getElementById("m-spec").value = "";
  document.getElementById("m-dispo").value = "";
  proShowToast("Membre ajoute", nom + " a rejoint l'equipe.");
}

function removeMember(id) {
  team = team.filter(m => m.id !== id);
  saveTeam();
  renderTeam();
}

renderTeam();
</script>
</body>
</html>
