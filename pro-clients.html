<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koupe Pro - Clients</title>
<link rel="stylesheet" href="_styles.css">
<style>
body{margin:0;background:var(--cream);font-family:var(--font-body);display:flex}.pro-side{width:240px;min-height:100vh;background:var(--velvet);padding:18px 10px;display:flex;flex-direction:column}.pro-brand{color:#fff;font-family:var(--font-display);font-size:30px;padding:0 10px 2px}.pro-badge{color:rgba(231,212,187,.45);font-size:11px;letter-spacing:.08em;font-weight:700;padding:0 10px 12px}.pro-link{display:block;color:rgba(255,255,255,.7);text-decoration:none;padding:10px 12px;border-radius:10px;margin:3px 0;font-size:14px}.pro-link.active{background:var(--plum);color:#fff}.pro-side-footer{margin-top:auto;padding-top:10px}.pro-main{flex:1;padding:24px}.pro-topbar{display:flex;justify-content:space-between;gap:12px;align-items:center}.pro-title{margin:0;font-family:var(--font-display);font-weight:500}.pro-subtitle{color:var(--sand);font-size:13px;margin-top:3px}.pro-top-actions{display:flex;gap:8px}.pro-breadcrumb{font-size:12px;color:var(--sand);margin:10px 0 14px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--border-soft);text-align:left;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}@media(max-width:900px){.pro-side{display:none}.pro-topbar{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<aside class="pro-side" id="pro-side"></aside>
<main class="pro-main">
  <div class="pro-topbar" id="pro-topbar"></div>
  <div class="pro-breadcrumb" id="pro-breadcrumb"></div>
  <div class="card">
    <div class="controls">
      <input id="q" class="form-input" placeholder="Rechercher..." style="max-width:240px">
      <select id="s" class="form-select" style="max-width:170px"><option value="all">Tous statuts</option><option>VIP</option><option>Actif</option><option>Nouveau</option></select>
      <button class="btn btn-primary btn-sm" onclick="addClient()">Ajouter</button>
    </div>
    <table><thead><tr><th>Nom</th><th>Telephone</th><th>Visites</th><th>Preference</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table>
  </div>
  <div class="toast-container" id="pro-toasts"></div>
</main>
<script src="script/_shared.js"></script>
<script src="script/pro-ui.js"></script>
<script>
initProPage({ active: "clients", title: "Clients", breadcrumb: "Clients" });
let data=getProClients();function save(){saveProClients(data)}function render(){const q=(document.getElementById('q').value||'').toLowerCase();const s=document.getElementById('s').value;const rows=data.filter(c=>(c.nom.toLowerCase().includes(q)||c.tel.toLowerCase().includes(q)||c.preference.toLowerCase().includes(q))&&(s==='all'||c.statut===s));document.getElementById('tb').innerHTML=rows.map(c=>`<tr><td>${c.nom}</td><td>${c.tel}</td><td>${c.visites}</td><td>${c.preference}</td><td>${c.statut}</td><td><button class="btn btn-outline btn-sm" onclick="editClient(${c.id})">Modifier</button> <button class="btn btn-ghost btn-sm" style="color:#c0392b" onclick="delClient(${c.id})">Supprimer</button></td></tr>`).join('')}function addClient(){const nom=prompt('Nom');if(!nom)return;const tel=prompt('Telephone','+216 ');if(tel===null)return;data.unshift({id:Date.now(),nom,tel,visites:0,derniereVisite:'N/A',preference:'Non defini',statut:'Nouveau'});save();render();proShowToast('Client ajoute',nom)}function editClient(id){const c=data.find(x=>x.id===id);if(!c)return;const n=prompt('Nom',c.nom);if(n===null)return;const t=prompt('Telephone',c.tel);if(t===null)return;const p=prompt('Preference',c.preference);if(p===null)return;const s=prompt('Statut (VIP, Actif, Nouveau)',c.statut);if(s===null)return;c.nom=n||c.nom;c.tel=t||c.tel;c.preference=p||c.preference;c.statut=s||c.statut;save();render()}function delClient(id){if(!confirm('Supprimer ce client ?'))return;data=data.filter(x=>x.id!==id);save();render()}document.getElementById('q').addEventListener('input',render);document.getElementById('s').addEventListener('change',render);render();
</script>
</body>
</html>
